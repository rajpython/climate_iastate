# Forecast display configuration — the single source of truth for how forecast tiles are wired.
#
# The deployed product is LOFRA's damped-persistence module run in-process on our own monthly
# per-zone `area_frac` (parity contract `area_frac = Σ(w·A)/Σ(w)`). Division of labor settled
# 2026-07-08 (docs/handoffs, Thread: forecast-transfer). See docs/forecast_extension/.
#
# Zone roles are product-dependent (per LOFRA's correction):
#   - persistence : point + AR(1) band + L1 occurrence probability, on the honesty ladder.
#   - climatology : magnitude/area falls below persistence by L2; show climatology only.
#   - onset       : SEBS-only two-state watch indicator (elevated/normal) — NEVER a probability.
# NBS is a persistence zone but carries an ice-contamination caveat and gets NO broad-field/LIM
# reading (the ice limit is about the LIM field interpretation, not NBS's own area_frac).

# Pin to a delivered, paper-validated module version. null until LOFRA ships v1 (frozen
# coefficients applied forward; re-fits are LOFRA re-validation events — we only bump this pin).
# Vendored verbatim at vendor/forecast-module-v1/ (SHA-256 verified against its DELIVERY-MANIFEST).
#
# The MODULE code stays v1 (byte-identical); LOFRA re-fits arrive as versioned COEFFICIENT-MANIFEST
# releases. `coefficient_manifest` names the pinned manifest inside vendor/forecast-module-v1/forecast/;
# bumping a re-fit is this one line, not a code change.
module_version: v1.1.0
coefficient_manifest: coefficient_manifest_v2.json   # v2: re-fit on the corrected (θ90-smoothed) predictand
coefficient_manifest_version: v2
# v2 provenance (SHA-256 verified vs DELIVERY-MANIFEST-coefficient-v2.md; delivered 2026-07-16):
#   predictand_snapshot        snap-obl064-predictand-corrected-v2-20260716
#   predictand_manifest_sha256 6efcb272c52ceaa7cdf8c43686791624a4d0c61b576e80e3c91f7262e6ebf7ad
#   json  052c88d838ea3b5f4e8bda358a707765d6dd909abab8d39e3b8042e696608cd8
#   npz   cee7a21f31e252225c890433b6eb5f12a4c405fd0d6b03b7a6b83c68f3d6d74c
# LOFRA-confirmed: DEPLOY_MAP + coefficient vintages UNCHANGED vs v1; only predictand-space couplings move.
fit_vintage: "2026-04-01"     # persistence/climatology coefficient vintage (shown on every tile; unchanged).
                              # SEBS onset's own 2026-05 vintage surfaces with the onset watch later.

# Forecast horizons (the honesty ladder). Leads are calendar months on our OISST cadence.
leads:
  - id: L1
    months: 1
    confidence: headline          # MSSS-vs-clim ~0.48–0.68 — show with confidence
  - id: L2
    months: 2
    confidence: banded            # MSSS ~0.15–0.40 — show, band honestly
  - id: L3
    months: 3
    confidence: watch             # MSSS ~0.09–0.27 — low-confidence "watch"

# Zone role map. Ids are leaves of the sealed 9-leaf partition (config/regions.geojson).
zones:
  sebs:       { role: persistence, ice_caveat: false, lim_reading: true,  onset: true  }
  wgoa:       { role: persistence, ice_caveat: false, lim_reading: true,  onset: false }
  egoa:       { role: persistence, ice_caveat: false, lim_reading: true,  onset: false }
  nbs:        { role: persistence, ice_caveat: true,  lim_reading: false, onset: false }
  ai_west:    { role: persistence, ice_caveat: false, lim_reading: true,  onset: false }
  ai_central: { role: persistence, ice_caveat: false, lim_reading: true,  onset: false }
  ai_east:    { role: persistence, ice_caveat: false, lim_reading: true,  onset: false }
  chukchi:    { role: climatology, ice_caveat: true,  lim_reading: false, onset: false }
  beaufort:   { role: climatology, ice_caveat: true,  lim_reading: false, onset: false }
