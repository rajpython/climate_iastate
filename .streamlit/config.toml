[server]
headless            = true
port                = 8501
enableCORS          = false
enableXsrfProtection = true
maxUploadSize       = 10

[browser]
gatherUsageStats = false

[theme]
# Default to Streamlit's standard light theme.
# Users can switch to dark from the menu: top-right ⋮ → Settings → Theme.
base              = "light"
primaryColor      = "#1f77b4"
font              = "sans serif"

[logger]
level = "warning"
